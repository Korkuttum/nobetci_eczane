name: Release

on:
  release:
    types: [published]

jobs:
  release-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: ZIP component directory
        run: |
          cd ${{ github.workspace }}/custom_components/nobetci_eczane
          zip -r nobetci_eczane.zip ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/nobetci_eczane/nobetci_eczane.zip
          asset_name: nobetci_eczane.zip
          tag: ${{ github.ref }}
          overwrite: true

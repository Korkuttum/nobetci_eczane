name: Release
on:
  release:
    types: [published]
jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP Component Dir
        run: |
          cd ${{ github.workspace }}/custom_components/nobetci_eczane
          zip -r nobetci_eczane.zip ./
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.PAT_TOKEN }}
          file: ${{ github.workspace }}/custom_components/nobetci_eczane/nobetci_eczane.zip
          asset_name: nobetci_eczane.zip
          tag: ${{ github.ref }}
          overwrite: true
